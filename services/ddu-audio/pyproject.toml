[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ddu-audio"
version = "0.0.1"
description = "DDU ddu-audio service"
requires-python = ">=3.11"
dependencies = [
    "ddu-py-common",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.30",
]

[tool.setuptools]
py-modules = ["app"]
