[build-system]
requires = ["setuptools==80.9.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "ddu-geo"
version = "0.0.1"
description = "DDU ddu-geo service"
requires-python = ">=3.11"
dependencies = [
    "ddu-py-common==0.0.1",
    "fastapi==0.140.13",
    "httpx==0.28.1",
    "pydantic==2.13.4",
    "uvicorn[standard]==0.52.0",
]

[project.optional-dependencies]
model = [
    "geoclip==1.2.0",
    "numpy==2.4.4",
    "Pillow==12.1.1",
    "torch==2.10.0",
    "torchvision==0.25.0",
]

[tool.setuptools]
py-modules = ["app"]
