[build-system]
requires = ["setuptools==83.0.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "ddu-mirror-intel"
version = "0.1.0"
description = "DDU Mirror — discovery, intelligence, and human-in-the-loop agent (Engineer B)"
requires-python = ">=3.11"
dependencies = [
    "ddu-py-common==0.0.1",
    "exifread==3.0.0",
    "fastapi==0.136.3",
    "httpx==0.28.1",
    "langgraph==1.2.10",
    "langgraph-checkpoint-redis==0.5.1",
    "langgraph-checkpoint-sqlite==3.1.0",
    "Pillow==11.3.0",
    "prometheus-client==0.26.0",
    "pydantic==2.13.4",
    "PyJWT[crypto]==2.13.0",
    "python-json-logger==4.1.0",
    "python-multipart==0.0.31",
    "redis==7.2.2",
    "sentry-sdk[fastapi]==2.32.0",
    "slowapi==0.1.10",
    "uvicorn[standard]==0.52.0",
]

# Optional on purpose. The service boots, scans, scores, and demos without
# either of these — `anthropic` missing drops the LLM layer to the
# deterministic offline provider, and `sherlock-project` missing falls back to
# cached account results. A hackathon demo should not be one pip install away
# from a blank screen.
[project.optional-dependencies]
llm = ["anthropic==0.116.0"]
discovery = ["sherlock-project==0.15.0"]
# Only needed to regenerate curated demo JPEGs with GPS EXIF.
vision-assets = ["piexif==1.1.3"]

[tool.setuptools]
py-modules = ["app"]

[tool.setuptools.packages.find]
include = ["mirror_intel*"]

[tool.setuptools.package-data]
mirror_intel = ["data/*.json", "data/vision_cache/*"]
