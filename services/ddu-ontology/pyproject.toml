[build-system]
requires = ["setuptools==80.9.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "ddu-ontology"
version = "0.0.1"
description = "DDU ddu-ontology service"
requires-python = ">=3.11"
dependencies = [
    "ddu-py-common==0.0.1",
    "fastapi==0.140.13",
    "httpx==0.28.1",
    "uvicorn[standard]==0.52.0",
]

[tool.setuptools]
py-modules = ["app"]
