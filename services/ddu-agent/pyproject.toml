[build-system]
requires = ["setuptools==80.9.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "ddu-agent"
version = "0.0.1"
description = "DDU ddu-agent service"
requires-python = ">=3.11"
dependencies = [
    "ddu-py-common==0.0.1",
    "fastapi==0.140.13",
    "httpx==0.28.1",
    "pydantic==2.13.4",
    "uvicorn[standard]==0.52.0",
    "langgraph==0.2.74",
    "langchain-core==0.3.28",
]

[tool.setuptools]
py-modules = ["app"]
