name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ─────────────────────────────────────────────
  # Protobuf contracts: lint + breaking-change check + stub generation
  # ─────────────────────────────────────────────
  contracts:
    name: contracts (buf)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: libs/ddu-contracts
    steps:
      - uses: actions/checkout@v7
      - uses: bufbuild/buf-setup-action@v1
        with:
          buf_user: ${{ secrets.BUF_USER }}
          buf_api_token: ${{ secrets.BUF_API_TOKEN }}
        continue-on-error: true
      - name: buf lint
        run: buf lint
      - name: buf breaking (against main)
        run: buf breaking --against "https://github.com/${{ github.repository }}.git#branch=main,subdir=libs/ddu-contracts"
        if: github.event_name == 'pull_request'
      - name: buf generate
        run: buf generate

  # ─────────────────────────────────────────────
  # Go: lint + build + vet for every Go service and lib
  # ─────────────────────────────────────────────
  # Go services/libs. Note: libs/ddu-contracts is primarily covered by the
  # contracts job (buf lint + buf generate) because it is a protobuf library
  # with generated Go. We still run go build there (below) to catch compile
  # errors buf does not surface; vet/test/lint are skipped for generated code.
  go:
    name: go (${{ matrix.module }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module:
          - libs/ddu-lineage-emitter
          - libs/ddu-evidence
          - libs/ddu-httpclient
          - services/ddu-api
          - services/ddu-ingest
          - services/ddu-storage
          - services/ddu-graph-store
          - services/ddu-vector
          - services/ddu-lineage
          - services/ddu-webcapture
          - services/ddu-collector
          - services/ddu-discovery
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.22"
          cache: false
      - name: go mod download
        run: go mod download
      - name: go vet
        run: go vet ./...
      - name: go build
        run: go build ./...
      - name: go test
        run: go test ./... -count=1
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v1.60
          working-directory: ${{ matrix.module }}
          args: --timeout=5m

  go-contracts-build:
    name: go (libs/ddu-contracts build-only)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: libs/ddu-contracts
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.22"
          cache: false
      - name: go build generated module
        run: |
          if [ -f go.mod ]; then
            go mod download
            go build ./...
          else
            echo "no go.mod yet (protobuf-only); contracts job covers generation"
          fi

  # ─────────────────────────────────────────────
  # Python: install + import smoke for every Python service and common lib
  # ─────────────────────────────────────────────
  python:
    name: python (${{ matrix.module }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module:
          - libs/ddu-py-common
          - services/ddu-vision
          - services/ddu-face
          - services/ddu-ocr
          - services/ddu-audio
          - services/ddu-geo
          - services/ddu-resolution
          - services/ddu-ontology
          - services/ddu-temporal
          - services/ddu-agent
          - services/ddu-osint
          - services/ddu-intel
          - services/ddu-mirror-intel
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: install ddu-py-common
        run: pip install -e libs/ddu-py-common
      - name: install ${{ matrix.module }}
        run: pip install -e ${{ matrix.module }}
        if: matrix.module != 'libs/ddu-py-common'
      - name: import smoke
        run: |
          python -c "import sys; sys.path.insert(0, '${{ matrix.module }}'); import app; print('${{ matrix.module }} ok')"
        if: startsWith(matrix.module, 'services/')
      - name: pytest
        run: |
          pip install pytest httpx
          python -m pytest ${{ matrix.module }}/test_app.py -q
        if: startsWith(matrix.module, 'services/') && hashFiles('${{ matrix.module }}/test_app.py') != ''
      - name: ruff
        run: pip install ruff==0.9.10 && ruff check ${{ matrix.module }} --select E9,F63,F7,F82
        if: startsWith(matrix.module, 'services/') || matrix.module == 'libs/ddu-py-common'

  # ─────────────────────────────────────────────
  # Docker compose: validate stack file syntax (no container startup yet)
  # ─────────────────────────────────────────────
  compose-validate:
    name: docker-compose validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: validate compose file
        run: |
          docker compose -f infra/docker-compose.yml config --quiet
          docker compose -f infra/docker-compose.yml -f infra/docker-compose.ddu.yml config --quiet

  # ─────────────────────────────────────────────
  # UI: typecheck + build the ddu-ui Vite app
  # ─────────────────────────────────────────────
  ui:
    name: ui (ddu-ui)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui/ddu-ui
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: npm install
        run: npm install
      - name: typecheck
        run: npx tsc --noEmit
      - name: unit tests
        run: npm test
      - name: build
        run: npm run build
      - name: verify-frontend script
        working-directory: .
        run: bash scripts/verify-frontend.sh

  smoke:
    name: mirror smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: install
        run: |
          pip install -e libs/ddu-py-common
          pip install -e services/ddu-mirror-intel
          pip install pytest httpx
      - name: pytest mirror-intel
        run: |
          export MIRROR_RATE_LIMIT=0
          export MIRROR_ENV=development
          python -m pytest services/ddu-mirror-intel -q
      - name: validate prod compose
        env:
          MIRROR_SESSION_ENCRYPTION_KEY: ci-only-not-for-production-use-32b
        run: docker compose -f infra/docker-compose.prod.yml config --quiet
      - name: smoke-test script
        run: |
          export MIRROR_RATE_LIMIT=0
          export MIRROR_ENV=development
          bash scripts/smoke-test.sh
      - name: verify-backend script
        run: |
          export MIRROR_RATE_LIMIT=0
          export MIRROR_ENV=development
          bash scripts/verify-backend.sh

  e2e:
    name: mirror e2e (playwright)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui/ddu-ui
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: install backend
        working-directory: .
        run: |
          pip install -e libs/ddu-py-common
          pip install -e services/ddu-mirror-intel
      - name: npm install
        run: npm install
      - name: install playwright browsers
        run: npx playwright install --with-deps chromium
      - name: run e2e
        env:
          MIRROR_RATE_LIMIT: "0"
          MIRROR_ENV: development
        run: npx playwright test --project=chromium

  trivy:
    name: trivy image scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: build mirror-intel image
        run: docker build -t ddu-mirror-intel:ci -f services/ddu-mirror-intel/Dockerfile .
      - name: run trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ddu-mirror-intel:ci
          severity: HIGH,CRITICAL
          exit-code: "1"
